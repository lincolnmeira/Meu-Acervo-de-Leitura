<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu Acervo de Leitura</title>
</head>
<body>

    <!-- Título principal da página -->
    <h1>Meu Acervo de Leitura</h1>

    <!-- 
        Container onde a lista de livros será renderizada dinamicamente.
        O texto "Carregando livros..." é apenas um placeholder inicial,
        substituído pelo JavaScript assim que os dados da API chegarem.
    -->
    <div id="lista-livros">
        <p>Carregando livros...</p>
    </div>

    <!-- 
        Script JS carregado no final do <body> para garantir que todo
        o HTML já esteja disponível no DOM antes do JS tentar manipulá-lo.
    -->
    <script src="script.js"></script>
</body>
</html>
